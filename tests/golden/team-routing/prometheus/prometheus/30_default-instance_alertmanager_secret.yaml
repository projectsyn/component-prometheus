apiVersion: v1
kind: Secret
metadata:
  annotations:
    source: https://github.com/projectsyn/component-prometheus
  labels:
    alertmanager: alertmanager-default-instance
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 0.22.2
  name: alertmanager-alertmanager-default-instance
  namespace: syn-prometheus
stringData:
  alertmanager.yaml: |-
    "global":
      "resolve_timeout": "5m"
    "receivers":
    - "name": "__prometheus_null"
    - "name": "foo"
      "opsgenie_configs":
      - "source": null
    "route":
      "group_by":
      - "namespace"
      "group_interval": "5m"
      "group_wait": "30s"
      "receiver": "Default"
      "repeat_interval": "12h"
      "routes":
      - "matchers":
        - "alertname = Watchdog"
        "receiver": "heartbeat"
        "repeat_interval": "60s"
      - "continue": true
        "matchers":
        - "syn_team = \"\""
        - "namespace =~ \"base|overridden\""
        "receiver": "team_default_chubby-cockroaches"
      - "continue": true
        "matchers":
        - "syn_team = \"\""
        - "namespace =~ \"instance-ns|ns-string\""
        "receiver": "team_default_clumsy-donkeys"
      - "continue": true
        "matchers":
        - "syn_team = \"\""
        - "namespace =~ \"ns-object|same-ns\""
        "receiver": "team_default_lovable-lizards"
      - "continue": false
        "matchers":
        - "syn_team = \"\""
        - "namespace =~ \"base|overridden|instance-ns|ns-string|ns-object|same-ns\""
        "receiver": "__prometheus_null"
      - "receiver": "team_default_clumsy-donkeys"
      - "matchers":
        - "other = \"true\""
        "receiver": "other"
type: Opaque
